# Deterministic form-field mapping: regex on the field label -> profile path.
# Resolves ~70-80% of fields with zero AI calls. Order matters (first match wins).

text_fields:
  - {pattern: "(?i)^(first|given).*name",            path: "preferred_first_name"}
  - {pattern: "(?i)legal.*first.*name",              path: "legal_first_name"}
  - {pattern: "(?i)^(last|family|sur).*name",        path: "last_name"}
  - {pattern: "(?i)^(full |)name$",                  path: "name"}
  - {pattern: "(?i)e-?mail",                         path: "email"}
  - {pattern: "(?i)(phone|mobile|cell)",             path: "phone"}
  - {pattern: "(?i)linkedin",                        path: "links.linkedin"}
  - {pattern: "(?i)github",                          path: "links.github"}
  - {pattern: "(?i)(portfolio|personal (web)?site)", path: "links.portfolio"}
  - {pattern: "(?i)^(website|url)$",                 path: "links.website"}
  - {pattern: "(?i)^city",                           path: "location.city"}
  - {pattern: "(?i)^(state|province)",               path: "location.state"}
  - {pattern: "(?i)^country",                        path: "location.country"}
  - {pattern: "(?i)(zip|postal)",                    path: "location.postal_code"}
  - {pattern: "(?i)(current |)school|university|college", path: "current_school"}
  - {pattern: "(?i)graduation.*(year|date)",         path: "graduation_year"}
  - {pattern: "(?i)(desired|expected).*(salary|compensation)", path: "preferences.desired_salary"}
  - {pattern: "(?i)(start date|available.*start|earliest.*start)", path: "preferences.earliest_start_date"}
  - {pattern: "(?i)how did you hear",                path: "preferences.how_did_you_hear"}
  - {pattern: "(?i)pronoun",                         path: "pronouns"}
  - {pattern: "(?i)(street|address line 1|mailing address)", path: "location.street_address"}
  - {pattern: "(?i)notice period",                   path: "preferences.notice_period_days"}
  - {pattern: "(?i)hours.*(per|a) week|weekly availability", path: "preferences.hours_per_week_available"}
  - {pattern: "(?i)(work arrangement|remote.*preference|onsite.*preference)", path: "preferences.work_arrangement"}
  - {pattern: "(?i)(major|field of study|course of study|discipline)", path: "field_of_study"}
  - {pattern: "(?i)travel.*(percent|%)",             path: "preferences.travel_percentage"}
  - {pattern: "(?i)(hourly rate|rate.*hour|pay rate)", path: "preferences.desired_hourly_rate"}
  - {pattern: "(?i)(referred by|referral)",          path: "eligibility.referral_name"}

# Boolean questions: the profile value is true/false, mapped onto the form's
# own option strings at fill time.
boolean_fields:
  - {pattern: "(?i)(authorized|eligible).*(work|employment)", path: "work_auth.authorized_to_work_us"}
  - {pattern: "(?i)(require|need).*(sponsorship|visa)",       path: "work_auth.requires_sponsorship"}
  - {pattern: "(?i)willing.*(relocate|relocation)",           path: "preferences.willing_to_relocate"}
  - {pattern: "(?i)(18 years|age of 18|at least 18|older)",   path: "eligibility.age_18_or_over"}
  - {pattern: "(?i)driver'?s? licen[sc]e",                    path: "eligibility.drivers_license"}
  - {pattern: "(?i)security clearance",                       path: "eligibility.security_clearance"}
  - {pattern: "(?i)background (check|screen)",                path: "eligibility.background_check_consent"}
  - {pattern: "(?i)(previously|ever).*(work|employ).*(here|for (us|this|our))", path: "eligibility.worked_here_before"}
  - {pattern: "(?i)drug (screen|test)",                       path: "eligibility.drug_screen_consent"}
  - {pattern: "(?i)reliable transportation",                  path: "eligibility.reliable_transportation"}
  - {pattern: "(?i)(relative|family member).*(employ|work)",  path: "eligibility.relatives_employed_here"}
  - {pattern: "(?i)non-?compete|non-?solicit",                path: "eligibility.non_compete"}
  - {pattern: "(?i)(terminated|asked to resign|dismissed)",   path: "eligibility.ever_terminated"}
  - {pattern: "(?i)applied.*(before|previously|in the past)", path: "eligibility.applied_here_before"}
  - {pattern: "(?i)willing.*travel|able.*travel",             path: "preferences.willing_to_travel"}
  - {pattern: "(?i)(nights|weekends|evening).*(work|available)|work.*(nights|weekends)", path: "preferences.nights_weekends_ok"}
  - {pattern: "(?i)currently enrolled",                       path: "currently_enrolled"}

# Demographic dropdowns: profile value must match one of the form's options,
# otherwise the field is left to the AI layer / manual routing.
choice_fields:
  - {pattern: "(?i)gender",                       path: "eeo.gender"}
  - {pattern: "(?i)(race|ethnic)",                path: "eeo.race_ethnicity"}
  - {pattern: "(?i)veteran",                      path: "eeo.veteran_status"}
  - {pattern: "(?i)disability",                   path: "eeo.disability_status"}
  - {pattern: "(?i)(education|degree) level",     path: "education_level"}

# Never auto-filled under any circumstance — these go to you, or nowhere.
# Anything here also blocks the essay writer.
never_auto:
  - "(?i)social security|\\bssn\\b"
  - "(?i)passport|driver'?s licen[cs]e number"
  - "(?i)bank|routing number|account number"
  - "(?i)password"

# Open prose. These cannot be MAPPED to a stored value — there is no such
# value — so the field_map and the mapping model both skip them. They are
# written by ai_compose from the resume instead, and every word is shown on
# the confirmation card before anything is submitted.
essay_fields:
  - "(?i)why do you want"
  - "(?i)cover letter"
  - "(?i)tell us about"
  - "(?i)describe (a|your)"
  - "(?i)what (interests|excites|draws)"
  - "(?i)in your own words"
